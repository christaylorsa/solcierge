<!doctype html><html><head><meta charset="utf-8">
<!-- Source of public/media/og.jpg (the link-preview card). To re-render from the repo root:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=6000 --screenshot=og.png "file://$PWD/scripts/og-card.html"
     then: ffmpeg -i og.png -q:v 3 public/media/og.jpg -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@400;500&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;background:#08070a;overflow:hidden}
.card{position:relative;width:1200px;height:630px;overflow:hidden}
.photo{position:absolute;inset:0;background:url(../public/media/hero-1.jpg) 62% 58%/auto 135% no-repeat;filter:saturate(.9) brightness(.62)}
.scrim-x{position:absolute;inset:0;background:linear-gradient(90deg,#08070a 0%,rgba(8,7,10,.94) 34%,rgba(8,7,10,.55) 62%,rgba(8,7,10,.2) 100%)}
.scrim-y{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,7,10,.55) 0%,transparent 35%,transparent 60%,rgba(8,7,10,.9) 100%)}
.grain{position:absolute;inset:0;opacity:.09;mix-blend-mode:overlay}
.copy{position:absolute;left:84px;top:78px;bottom:72px;display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:14px;font-family:'Cormorant Garamond',serif;font-size:38px;color:#f4f1ea;letter-spacing:.005em}
.brand small{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.28em;color:#6b6559;text-transform:uppercase}
h1{margin-top:auto;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:104px;line-height:.98;letter-spacing:-.01em;color:#f4f1ea}
h1 em{display:block;font-style:italic;font-weight:400;color:#c9a94e}
.rule{margin-top:38px;width:56px;height:1px;background:#c9a94e;opacity:.7}
.foot{margin-top:24px;font-family:Inter,sans-serif;font-size:19px;letter-spacing:.02em;color:#a19a8d}
.foot b{font-weight:500;color:#e3cd8c}
.url{position:absolute;right:72px;bottom:72px;font-family:Inter,sans-serif;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:#a19a8d}
</style></head><body><div class="card">
<div class="photo"></div><div class="scrim-x"></div><div class="scrim-y"></div>
<svg class="grain" width="1200" height="630"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="copy">
  <div class="brand">Solcierge <small>By request · Solana native</small></div>
  <h1>Book anything.<em>Pay in crypto.</em></h1>
  <div class="rule"></div>
  <p class="foot">Jets · Yachts · Villas · Tables · Access &nbsp;—&nbsp; quoted in USD, settled in <b>SOL or USDC</b></p>
</div>
<div class="url">solcierge.xyz</div>
</div></body></html>
